<!-- 橫幅是裝飾圖(站名在下面頂欄的 h1),對輔助科技隱藏。<picture>:手機(≤560px)載 2:1 方圖、其餘載 6:1 寬圖;WebP 優先、PNG 退路(只會下載一張) -->
<picture class="banner" id="banner" aria-hidden="true">
  <source media="(max-width:560px)" srcset="assets/banner-mobile.webp" type="image/webp">
  <source media="(max-width:560px)" srcset="banner-mobile.png">
  <source srcset="assets/banner-1200.webp 1200w, assets/banner.webp 2400w" sizes="100vw" type="image/webp">
  <img class="bimg" src="banner.png" width="2400" height="400" fetchpriority="high" decoding="async" alt="">
</picture>
<header class="topbar">
  <h1 class="brand">🐶❤️🐰 Annyeongz 平行宇宙 🐰❤️🐶</h1>
  <input id="q" class="search" type="search" placeholder="🔍 搜尋標題 / 番外篇名 / 作者 / 譯者 / 人設(簡繁皆可)" aria-label="搜尋標題 / 番外篇名 / 作者 / 譯者 / 人設(簡繁皆可)">
  <button type="button" id="installBtn" class="theme install" hidden title="安裝到桌面" aria-label="安裝到桌面">⬇️ 安裝</button>
  <button type="button" id="theme" class="theme" title="切換白晝 / 黑夜" aria-label="切換白晝 / 黑夜">🌙</button>
  <!-- 📊 統計星圖:手機在頂欄(這顆);桌機(>860px)改放工具列的 #statsTb,這顆藏起來(base.css),不重複 -->
  <a class="theme" id="statsLink" href="stats.html" title="統計星圖" aria-label="統計星圖">📊</a>
</header>

<div class="loading-note" id="loadingNote" aria-live="polite">🛰️ 星圖載入中…</div>
<div class="wrap">
  <!-- 面板標題用 h2(手機顯示 panelbar 的、桌機顯示 paneltitle 的),分面才是 h3,標題層級才不會從 h1 跳到 h3 -->
  <!-- #panelTools:手機工具列壓縮時,穿越蟲洞 / 書架 / 隱藏 / 複製 / 重設那組(#tbExtra)搬到這裡;其餘時候是空的 -->
  <aside class="panel" id="panel" aria-label="分類篩選"><div class="panelbar"><h2>🔧 分類篩選</h2><button type="button" class="ctl pbdone">完成</button></div><div id="panelTools"></div><h2 class="paneltitle">分類篩選</h2></aside>
  <main class="main" id="main" tabindex="-1">
    <!-- 輪播:role=region + aria-roledescription=輪播;‹ › 可 Tab 聚焦、小卡上 ← → 切換;.strip-page 以 aria-live 宣告目前頁數 -->
    <section id="annSec" style="display:none">
      <h2 class="sech" id="annH">📻 星際廣播</h2>
      <div class="striprow" role="region" aria-roledescription="輪播" aria-labelledby="annH"><button type="button" class="snav l" aria-label="星際廣播：往前捲">‹</button><div class="strip" id="ann"></div><button type="button" class="snav r" aria-label="星際廣播：往後捲">›</button><span class="sr-only strip-page" aria-live="polite"></span></div>
    </section>
    <section id="latestSec">
      <h2 class="sech" id="latestH">✨ 新星誕生</h2>
      <div class="striprow" role="region" aria-roledescription="輪播" aria-labelledby="latestH"><button type="button" class="snav l" aria-label="新星誕生：往前捲">‹</button><div class="strip" id="latest"></div><button type="button" class="snav r" aria-label="新星誕生：往後捲">›</button><span class="sr-only strip-page" aria-live="polite"></span></div>
    </section>
    <section id="statusSec">
      <h2 class="sech" id="statusH">🛰️ 軌道更新 <span style="font-size:12px;color:var(--muted);font-weight:400">(依最近編輯)</span></h2>
      <div class="striprow" role="region" aria-roledescription="輪播" aria-labelledby="statusH"><button type="button" class="snav l" aria-label="軌道更新：往前捲">‹</button><div class="strip" id="statusUpd"></div><button type="button" class="snav r" aria-label="軌道更新：往後捲">›</button><span class="sr-only strip-page" aria-live="polite"></span></div>
    </section>
    <section id="hotSec">
      <h2 class="sech">🌠 熱門星系 <span style="font-size:12px;color:var(--muted);font-weight:400">(依收錄篇數)</span></h2>
      <div class="opts" id="hot"></div>
    </section>
    <section>
      <!-- 工具列 sticky 貼在頂欄下方(main.js 用 IntersectionObserver 盯 #tbSentinel 決定 .stuck;手機捲過去再加 .mini 壓縮成一排)。
           桌機固定兩排(main.css 用 order + ::after 斷行):第一排 標題 / 排序 … 跳到 # / 共 N 篇靠右,第二排 #tbExtra 那組工具鈕靠左。
           #tbExtra 那組在手機壓縮時搬進篩選面板的 #panelTools;#tbSpace 補回少掉的高度,下面的版面不跳(書架展開時不補,分頁緊接工具列) -->
      <div id="tbSentinel" aria-hidden="true"></div>
      <div class="toolbar" id="toolbar">
        <h2 class="sech" style="margin:0">🌌 平行宇宙 🪐</h2>
        <button type="button" class="ctl" id="filterToggle" aria-expanded="false" aria-controls="panel">🔧 篩選</button>
        <select id="sort" class="ctl" aria-label="排序方式">
          <option value="old">編號 小→大</option>
          <option value="new">編號 大→小</option>
          <option value="latest">🆕 最新收錄</option>
          <option value="likes">❤️ 愛心最多</option>
          <option value="views">🔭 最多人觀測</option>
        </select>
        <div class="tbx" id="tbExtra">
          <button type="button" class="ctl" id="rand" aria-label="穿越蟲洞，隨機開一篇">🌀 穿越蟲洞</button>
          <button type="button" class="ctl" id="shelfBtn" aria-pressed="false" aria-label="書架，只看我收藏 / 待閱讀 / 已讀的文">📚 書架</button>
          <label class="ctl chk"><input type="checkbox" id="hideRead">隱藏已讀</label>
          <label class="ctl chk"><input type="checkbox" id="hideDead">隱藏原文已刪</label>
          <button type="button" class="ctl" id="shareBtn" title="複製目前篩選的網址,分享給別人" aria-label="複製篩選，把目前篩選的網址複製到剪貼簿">🔗 複製篩選</button>
          <button type="button" class="ctl" id="reset" aria-label="重設篩選，清除所有條件">重設篩選</button>
          <!-- 桌機的統計星圖入口(手機藏起來、用頂欄的 #statsLink):跟其他工具鈕同樣式,放在這組最後,離內容近 -->
          <a class="ctl" id="statsTb" href="stats.html">📊 統計星圖</a>
        </div>
        <!-- 跳到 #編號:在目前篩選結果裡找到該篇,自動載入到那張卡、捲過去並短暫高亮 -->
        <form class="jumpbar" id="jumpForm" autocomplete="off">
          <label for="jumpNo">跳到 #</label><input id="jumpNo" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="編號" aria-label="跳到編號">
          <button type="submit" class="ctl">前往</button>
          <span class="jmsg" id="jumpMsg" role="status" aria-live="polite"></span>
        </form>
        <button type="button" class="ctl" id="toTopBar" aria-label="回到頂部">↑</button>
        <span class="count" id="count"></span>
        <span class="sr-only" id="liveCount" aria-live="polite" aria-atomic="true"></span>
      </div>
      <div id="tbSpace" aria-hidden="true"></div>
      <div class="shelf-tabs" id="shelfTabs" style="display:none"></div>
      <div class="hint">同區點多個＝任一(OR)、跨區＝同時(AND)、再點一下＝排除(紅刪除線);區標題可切「任一/全部」。點書卡看詳情。</div>
      <div class="authorhead" id="authorHead" style="display:none"></div>
      <div class="sel-bar" id="selbar"></div>
      <div id="list" class="grid"></div>
      <!-- 分批渲染的哨兵:捲到附近自動補下一批;按鈕是沒有 IntersectionObserver 時的退路 -->
      <div id="more" class="more" hidden><span class="more-txt" aria-live="polite"></span><button type="button" class="ctl">再載入 40 篇 ↓</button></div>
    </section>
  </main>
</div>

<footer class="site-footer">
  <div class="counter-card" id="statsCard"></div>

<script>

  REPORT_API:"https://yashen0512--925fd3b67dd111f1bfe71607ee4eb77e.web.val.run",
  STATS_API:"https://yashen0512--8328cb68778d11f19f361607ee4eb77e.web.val.run"
