name: Sync from Notion

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build deps (Pillow for OG images)
        run: pip install -r requirements.txt
      - name: Fetch from Notion & build site
        working-directory: _build
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          CANARY_SECRET: ${{ secrets.CANARY_SECRET }}   # 隱形版權 canary 的祕密(選填;沒設就不埋 _canary,見 _build/canary.py)
          SITE_OUT: '..'
          PYTHONIOENCODING: utf-8
        run: |
          python fetch_data.py
          python build_site.py
          python build_pages.py
      - name: Commit changes (persist)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data.json sw.js p sitemap.xml feed.xml feed-updated.xml robots.txt _build/article_links.json _build/reactions_backup.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto-sync from Notion"
            git push
          fi
      # 部署整個倉庫(path: '.'):index.html / data.json / sw.js 之外,統計星圖 stats.html、src/、styles/、vendor/(Chart.js)也一併上線;
      # build_site.py 的架構自檢會確認 stats.html 與 vendor/chart.umd.js 都在輸出資料夾。
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      # 發佈偶爾會因 GitHub 端暫時性錯誤失敗(2026/11/23 08:31 那班:剛上傳的打包檔查不到,
      # 「No artifacts named "github-pages" were found」),結果要等下一班才上線。
      # 所以第一次失敗不算數(continue-on-error),等 30 秒再試一次;第二次也失敗才讓整班失敗、寄通知信。
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retrying deploy
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
